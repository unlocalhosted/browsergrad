name: Publish npm packages

on:
  workflow_dispatch:

concurrency:
  group: browsergrad-npm-production
  queue: max

jobs:
  validate:
    name: Validate and stage missing packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Verify publish commit is reachable from main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Manual npm publication must run from refs/heads/main"
            exit 1
          fi
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::Publish SHA must be reachable from protected main"
            exit 1
          }

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.34.5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm -r run build

      - name: Verify semantic architecture boundaries
        run: pnpm architecture:check

      - name: Verify packed package metadata and exports
        run: pnpm test:release-packages

      - name: Verify publication plan and existing dependency artifacts
        run: node scripts/publish-missing-npm.mjs --preflight

      - name: Run Grad integration suite
        run: pnpm --filter @unlocalhosted/browsergrad-grad run test:integration

      - name: Run JIT integration suite
        run: pnpm --filter @unlocalhosted/browsergrad-jit run test:integration

      - name: Install Playwright Chromium
        run: pnpm --filter @unlocalhosted/browsergrad-kernels exec playwright install --with-deps chromium

      - name: Run required semantic view-copy WebGPU gate
        run: |
          set -o pipefail
          pnpm --filter @unlocalhosted/browsergrad-kernels test:browser:view-copy:required 2>&1 | tee semantic-view-copy-webgpu-evidence.log
        env:
          BG_BROWSER_HEADLESS: '1'

      - name: Retain semantic view-copy WebGPU evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semantic-view-copy-webgpu-evidence-${{ github.sha }}
          path: semantic-view-copy-webgpu-evidence.log
          if-no-files-found: error

      - name: Run required compiler layout-binding WebGPU gate
        run: |
          set -o pipefail
          pnpm --filter @unlocalhosted/browsergrad-compiler test:browser:layout-bindings:required 2>&1 | tee compiler-layout-bindings-webgpu-evidence.log
        env:
          BG_BROWSER_HEADLESS: '1'

      - name: Retain compiler layout-binding WebGPU evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compiler-layout-bindings-webgpu-evidence-${{ github.sha }}
          path: compiler-layout-bindings-webgpu-evidence.log
          if-no-files-found: error

      - name: Run required compiler view-copy-binding WebGPU gate
        run: |
          set -o pipefail
          pnpm --filter @unlocalhosted/browsergrad-compiler test:browser:view-copy-bindings:required 2>&1 | tee compiler-view-copy-bindings-webgpu-evidence.log
        env:
          BG_BROWSER_HEADLESS: '1'

      - name: Verify compiler view-copy-binding retained terminal record
        run: node packages/browsergrad-compiler/scripts/verify_view_copy_bindings_evidence_log.mjs compiler-view-copy-bindings-webgpu-evidence.log "${GITHUB_SHA}"

      - name: Retain compiler view-copy-binding WebGPU evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compiler-view-copy-bindings-webgpu-evidence-${{ github.sha }}
          path: compiler-view-copy-bindings-webgpu-evidence.log
          if-no-files-found: error

      - name: Run required JIT-emitted semantic-permute WebGPU gate
        run: |
          set -o pipefail
          pnpm --filter @unlocalhosted/browsergrad-jit test:browser:semantic-permute:required 2>&1 | tee jit-semantic-permute-webgpu-evidence.log
        env:
          BG_BROWSER_HEADLESS: '1'

      - name: Verify JIT semantic-permute retained terminal record
        run: node packages/browsergrad-jit/scripts/verify_semantic_permute_evidence_log.mjs jit-semantic-permute-webgpu-evidence.log "${GITHUB_SHA}"

      - name: Retain JIT semantic-permute WebGPU evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jit-semantic-permute-webgpu-evidence-${{ github.sha }}
          path: jit-semantic-permute-webgpu-evidence.log
          if-no-files-found: error

      - name: Provision pinned real-world CUDA corpora
        run: pnpm --filter @unlocalhosted/browsergrad-compiler provision:real-world-cuda

      - name: Run compiler real-world CUDA gate
        run: pnpm --filter @unlocalhosted/browsergrad-compiler verify:real-world-cuda -- --skip-fetch --require-webgpu

      - name: Stage immutable npm artifacts
        run: node scripts/publish-missing-npm.mjs --stage-dir npm-release-artifacts
        env:
          BG_REQUIRED_WEBGPU_EVIDENCE_COMMIT: ${{ github.sha }}
          BG_REQUIRED_COMPILER_LAYOUT_WEBGPU_EVIDENCE_COMMIT: ${{ github.sha }}
          BG_REQUIRED_COMPILER_VIEW_COPY_BINDINGS_WEBGPU_EVIDENCE_COMMIT: ${{ github.sha }}
          BG_REQUIRED_JIT_SEMANTIC_PERMUTE_WEBGPU_EVIDENCE_COMMIT: ${{ github.sha }}

      - name: Retain immutable npm artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-release-artifacts-${{ github.sha }}
          path: npm-release-artifacts
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish protected immutable packages
    needs: validate
    runs-on: ubuntu-latest
    environment: npm-production
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install attestation-capable npm CLI
        run: npm install --global npm@11.12.1 --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ''
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ''
          NPM_CONFIG_USERCONFIG: /dev/null
          NPM_CONFIG_GLOBALCONFIG: /dev/null

      - name: Require attestation-capable npm CLI
        run: node scripts/require-npm-version.mjs 11.12.0

      - name: Download immutable npm artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-release-artifacts-${{ github.sha }}
          path: npm-release-artifacts

      - name: Verify publish commit is still reachable from main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Manual npm publication must remain on refs/heads/main"
            exit 1
          fi
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::Publish SHA must remain reachable from protected main"
            exit 1
          }

      - name: Publish immutable artifacts
        run: node scripts/publish-missing-npm.mjs --publish-staged npm-release-artifacts --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
