name: Verify existing Clang-Wasm clean builds

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Completed build-clang-wasm reproducibility run containing both clean artifacts
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: verify-clang-wasm-reproducibility-${{ inputs.source_run_id }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify existing clean extractor artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BG_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
    steps:
      - name: Check out the exact verifier revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Install Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Admit the source workflow run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "${BG_SOURCE_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          bg_run_record="${RUNNER_TEMP}/browsergrad-source-run.json"
          bg_jobs_record="${RUNNER_TEMP}/browsergrad-source-jobs.json"
          curl --fail --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${BG_SOURCE_RUN_ID}" \
            --output "${bg_run_record}"
          jq --exit-status \
            --argjson run_id "${BG_SOURCE_RUN_ID}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            '.id == $run_id and
             .status == "completed" and
             .event == "workflow_dispatch" and
             .path == ".github/workflows/build-clang-wasm.yml" and
             .head_repository.full_name == $repository and
             (.head_sha | test("^[0-9a-f]{40}$"))' \
            "${bg_run_record}" >/dev/null
          curl --fail --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${BG_SOURCE_RUN_ID}/jobs?filter=all&per_page=100" \
            --output "${bg_jobs_record}"
          jq --exit-status \
            '[.jobs[] | select(.name == "Locked Linux amd64 build 1" or
                              .name == "Locked Linux amd64 build 2")] as $builds |
             ($builds | length) == 2 and
             ($builds | all(.status == "completed" and .conclusion == "success"))' \
            "${bg_jobs_record}" >/dev/null

      - name: Build the current verification boundary
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm --filter @unlocalhosted/browsergrad-compiler... build
          pnpm --filter @unlocalhosted/browsergrad-compiler test:browser-clang-wasm-build-plan:fast

      - name: Allocate private comparison root
        run: |
          set -euo pipefail
          bg_clang_repro_root="${RUNNER_TEMP}/browsergrad-clang-wasm-existing-${GITHUB_RUN_ID}"
          mkdir -m 0700 "${bg_clang_repro_root}"
          echo "BG_CLANG_REPRO_ROOT=${bg_clang_repro_root}" >> "${GITHUB_ENV}"

      - name: Download clean build 1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: clang-wasm-build-${{ inputs.source_run_id }}-1
          path: ${{ runner.temp }}/browsergrad-clang-wasm-existing-${{ github.run_id }}/first
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}

      - name: Download clean build 2
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: clang-wasm-build-${{ inputs.source_run_id }}-2
          path: ${{ runner.temp }}/browsergrad-clang-wasm-existing-${{ github.run_id }}/second
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}

      - name: Verify extractor reproducibility
        run: |
          set -euo pipefail
          node \
            packages/browsergrad-compiler/scripts/cpp_cute_browser_build/cpp_cute_browser_build_reproducibility.mjs \
            --first-root="${BG_CLANG_REPRO_ROOT}/first" \
            --second-root="${BG_CLANG_REPRO_ROOT}/second" \
            --output="${BG_CLANG_REPRO_ROOT}/clang-wasm-reproducibility.v3.json"
          sha256sum "${BG_CLANG_REPRO_ROOT}/clang-wasm-reproducibility.v3.json"

      - name: Inspect reproducible Wasm against the pinned runtime ABI
        run: |
          set -euo pipefail
          node \
            packages/browsergrad-compiler/scripts/cpp_cute_browser_build/cpp_cute_browser_wasm_review.mjs \
            --wasm="${BG_CLANG_REPRO_ROOT}/first/output/browsergrad-cpp-cute/clang-extractor.wasm" \
            --output="${BG_CLANG_REPRO_ROOT}/clang-wasm-runtime-abi-review.v1.json"
          sha256sum "${BG_CLANG_REPRO_ROOT}/clang-wasm-runtime-abi-review.v1.json"

      - name: Upload reproducibility and raw-Wasm review evidence
        if: ${{ success() && env.BG_CLANG_REPRO_ROOT != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clang-wasm-reproducibility-${{ github.run_id }}-from-${{ inputs.source_run_id }}
          path: |
            ${{ env.BG_CLANG_REPRO_ROOT }}/clang-wasm-reproducibility.v3.json
            ${{ env.BG_CLANG_REPRO_ROOT }}/clang-wasm-runtime-abi-review.v1.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
