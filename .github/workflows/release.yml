# Release one package from a protected-main tag: <package>-v<semver>.
# Example: git tag jit-v0.9.0 && git push origin jit-v0.9.0
# Validation and packing run without npm credentials or OIDC. Protected publish
# receives only the immutable staged artifacts and publishes with scripts off.

name: Release

on:
  push:
    tags:
      - 'jit-v*'
      - 'runtime-v*'
      - 'primitives-v*'
      - 'kernels-v*'
      - 'grad-v*'
      - 'compiler-v*'
      - 'semantic-core-v*'

concurrency:
  group: browsergrad-npm-production
  queue: max

jobs:
  validate:
    name: Validate and stage immutable package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45
    outputs:
      shortname: ${{ steps.parse.outputs.shortname }}
      version: ${{ steps.parse.outputs.version }}
      package: ${{ steps.parse.outputs.package }}
      npmname: ${{ steps.parse.outputs.npmname }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Verify release commit is reachable from main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::Release SHA must be reachable from protected main"
            exit 1
          }

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.34.5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Parse tag to package and version
        id: parse
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          SHORTNAME="${TAG%-v*}"
          VERSION="${TAG#*-v}"
          PACKAGE="browsergrad-$SHORTNAME"
          NPMNAME="@unlocalhosted/$PACKAGE"
          PKG_VERSION=$(jq -r .version "packages/$PACKAGE/package.json")
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version $VERSION doesn't match package.json $PKG_VERSION"
            exit 1
          fi
          echo "shortname=$SHORTNAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "npmname=$NPMNAME" >> "$GITHUB_OUTPUT"

      - name: Build workspace
        run: pnpm -r build

      - name: Verify semantic architecture boundaries
        run: pnpm architecture:check

      - name: Verify packed package metadata and exports
        run: pnpm test:release-packages

      - name: Surface tests
        run: pnpm --filter "${{ steps.parse.outputs.npmname }}" run test

      - name: Integration tests (JIT or Grad release)
        if: contains(fromJSON('["jit","grad"]'), steps.parse.outputs.shortname)
        run: pnpm --filter "${{ steps.parse.outputs.npmname }}" run test:integration

      - name: Verify selected package dependency closure is published and equivalent
        run: node scripts/publish-missing-npm.mjs --preflight --package "${{ steps.parse.outputs.npmname }}"

      - name: Install Playwright Chromium (compiler, kernels, or JIT release)
        if: contains(fromJSON('["compiler","kernels","jit"]'), steps.parse.outputs.shortname)
        run: pnpm --filter @unlocalhosted/browsergrad-kernels exec playwright install --with-deps chromium

      - name: Required semantic view-copy WebGPU gate (kernels release)
        if: steps.parse.outputs.shortname == 'kernels'
        run: |
          set -o pipefail
          pnpm --filter @unlocalhosted/browsergrad-kernels test:browser:view-copy:required 2>&1 | tee semantic-view-copy-webgpu-evidence.log
        env:
          BG_BROWSER_HEADLESS: '1'

      - name: Retain semantic view-copy WebGPU evidence (kernels release)
        if: always() && steps.parse.outputs.shortname == 'kernels'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semantic-view-copy-webgpu-evidence-${{ github.sha }}
          path: semantic-view-copy-webgpu-evidence.log
          if-no-files-found: error

      - name: Required semantic host-graph WebGPU gate (kernels release)
        if: steps.parse.outputs.shortname == 'kernels'
        run: |
          set -o pipefail
          pnpm --filter @unlocalhosted/browsergrad-kernels test:browser:semantic-host-graph:required 2>&1 | tee semantic-host-graph-webgpu-evidence.log
        env:
          BG_BROWSER_HEADLESS: '1'

      - name: Retain semantic host-graph WebGPU evidence (kernels release)
        if: always() && steps.parse.outputs.shortname == 'kernels'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semantic-host-graph-webgpu-evidence-${{ github.sha }}
          path: semantic-host-graph-webgpu-evidence.log
          if-no-files-found: error

      - name: Required semantic host-graph Worker WebGPU gate (kernels release)
        if: steps.parse.outputs.shortname == 'kernels'
        run: |
          set -o pipefail
          pnpm --filter @unlocalhosted/browsergrad-kernels test:browser:semantic-host-graph-worker:required 2>&1 | tee semantic-host-graph-worker-webgpu-evidence.log
        env:
          BG_BROWSER_HEADLESS: '1'

      - name: Retain semantic host-graph Worker WebGPU evidence (kernels release)
        if: always() && steps.parse.outputs.shortname == 'kernels'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semantic-host-graph-worker-webgpu-evidence-${{ github.sha }}
          path: semantic-host-graph-worker-webgpu-evidence.log
          if-no-files-found: error

      - name: Required semantic host-graph WebGPU performance gate (kernels release)
        if: steps.parse.outputs.shortname == 'kernels'
        run: |
          set -o pipefail
          pnpm --filter @unlocalhosted/browsergrad-kernels test:browser:semantic-host-graph:performance:required 2>&1 | tee semantic-host-graph-performance-webgpu-evidence.log
        env:
          BG_BROWSER_HEADLESS: '1'

      - name: Retain semantic host-graph WebGPU performance evidence (kernels release)
        if: always() && steps.parse.outputs.shortname == 'kernels'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semantic-host-graph-performance-webgpu-evidence-${{ github.sha }}
          path: semantic-host-graph-performance-webgpu-evidence.log
          if-no-files-found: error

      - name: Required semantic GEMM WebGPU gate (kernels release)
        if: steps.parse.outputs.shortname == 'kernels'
        run: |
          set -o pipefail
          pnpm --filter @unlocalhosted/browsergrad-kernels test:browser:semantic-gemm:required 2>&1 | tee semantic-gemm-webgpu-evidence.log
        env:
          BG_BROWSER_HEADLESS: '1'

      - name: Retain semantic GEMM WebGPU evidence (kernels release)
        if: always() && steps.parse.outputs.shortname == 'kernels'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semantic-gemm-webgpu-evidence-${{ github.sha }}
          path: semantic-gemm-webgpu-evidence.log
          if-no-files-found: error

      - name: Required semantic attention WebGPU gate (kernels release)
        if: steps.parse.outputs.shortname == 'kernels'
        run: |
          set -o pipefail
          pnpm --filter @unlocalhosted/browsergrad-kernels test:browser:semantic-attention:required 2>&1 | tee semantic-attention-webgpu-evidence.log
        env:
          BG_BROWSER_HEADLESS: '1'

      - name: Retain semantic attention WebGPU evidence (kernels release)
        if: always() && steps.parse.outputs.shortname == 'kernels'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semantic-attention-webgpu-evidence-${{ github.sha }}
          path: semantic-attention-webgpu-evidence.log
          if-no-files-found: error

      - name: Required semantic attention WebGPU performance gate (kernels release)
        if: steps.parse.outputs.shortname == 'kernels'
        run: |
          set -o pipefail
          pnpm --filter @unlocalhosted/browsergrad-kernels test:browser:semantic-attention:performance:required 2>&1 | tee semantic-attention-performance-webgpu-evidence.log
        env:
          BG_BROWSER_HEADLESS: '1'

      - name: Retain semantic attention WebGPU performance evidence (kernels release)
        if: always() && steps.parse.outputs.shortname == 'kernels'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semantic-attention-performance-webgpu-evidence-${{ github.sha }}
          path: semantic-attention-performance-webgpu-evidence.log
          if-no-files-found: error

      - name: Provision pinned real-world CUDA corpora (compiler release)
        if: steps.parse.outputs.shortname == 'compiler'
        run: pnpm --filter @unlocalhosted/browsergrad-compiler provision:real-world-cuda

      - name: Real-world CUDA gate (compiler release)
        if: steps.parse.outputs.shortname == 'compiler'
        run: pnpm --filter @unlocalhosted/browsergrad-compiler verify:real-world-cuda -- --skip-fetch --require-webgpu

      - name: Required compiler layout-binding WebGPU gate (compiler release)
        if: steps.parse.outputs.shortname == 'compiler'
        run: |
          set -o pipefail
          pnpm --filter @unlocalhosted/browsergrad-compiler test:browser:layout-bindings:required 2>&1 | tee compiler-layout-bindings-webgpu-evidence.log
        env:
          BG_BROWSER_HEADLESS: '1'

      - name: Retain compiler layout-binding WebGPU evidence (compiler release)
        if: always() && steps.parse.outputs.shortname == 'compiler'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compiler-layout-bindings-webgpu-evidence-${{ github.sha }}
          path: compiler-layout-bindings-webgpu-evidence.log
          if-no-files-found: error

      - name: Required compiler view-copy-binding WebGPU gate (compiler release)
        if: steps.parse.outputs.shortname == 'compiler'
        run: |
          set -o pipefail
          pnpm --filter @unlocalhosted/browsergrad-compiler test:browser:view-copy-bindings:required 2>&1 | tee compiler-view-copy-bindings-webgpu-evidence.log
        env:
          BG_BROWSER_HEADLESS: '1'

      - name: Verify compiler view-copy-binding retained terminal record (compiler release)
        if: steps.parse.outputs.shortname == 'compiler'
        run: node packages/browsergrad-compiler/scripts/verify_view_copy_bindings_evidence_log.mjs compiler-view-copy-bindings-webgpu-evidence.log "${GITHUB_SHA}"

      - name: Retain compiler view-copy-binding WebGPU evidence (compiler release)
        if: always() && steps.parse.outputs.shortname == 'compiler'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compiler-view-copy-bindings-webgpu-evidence-${{ github.sha }}
          path: compiler-view-copy-bindings-webgpu-evidence.log
          if-no-files-found: error

      - name: Required JIT-emitted semantic-permute WebGPU gate (JIT or kernels release)
        if: contains(fromJSON('["jit","kernels"]'), steps.parse.outputs.shortname)
        run: |
          set -o pipefail
          pnpm --filter @unlocalhosted/browsergrad-jit test:browser:semantic-permute:required 2>&1 | tee jit-semantic-permute-webgpu-evidence.log
        env:
          BG_BROWSER_HEADLESS: '1'

      - name: Verify JIT semantic-permute retained terminal record (JIT or kernels release)
        if: contains(fromJSON('["jit","kernels"]'), steps.parse.outputs.shortname)
        run: node packages/browsergrad-jit/scripts/verify_semantic_permute_evidence_log.mjs jit-semantic-permute-webgpu-evidence.log "${GITHUB_SHA}"

      - name: Retain JIT semantic-permute WebGPU evidence (JIT or kernels release)
        if: always() && contains(fromJSON('["jit","kernels"]'), steps.parse.outputs.shortname)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jit-semantic-permute-webgpu-evidence-${{ github.sha }}
          path: jit-semantic-permute-webgpu-evidence.log
          if-no-files-found: error

      - name: Stage immutable npm artifact
        run: node scripts/publish-missing-npm.mjs --stage-dir npm-release-artifacts --package "${{ steps.parse.outputs.npmname }}"
        env:
          BG_REQUIRED_WEBGPU_EVIDENCE_COMMIT: ${{ github.sha }}
          BG_REQUIRED_SEMANTIC_HOST_GRAPH_WEBGPU_EVIDENCE_COMMIT: ${{ github.sha }}
          BG_REQUIRED_SEMANTIC_HOST_GRAPH_WORKER_WEBGPU_EVIDENCE_COMMIT: ${{ github.sha }}
          BG_REQUIRED_SEMANTIC_HOST_GRAPH_WEBGPU_PERFORMANCE_EVIDENCE_COMMIT: ${{ github.sha }}
          BG_REQUIRED_SEMANTIC_GEMM_WEBGPU_EVIDENCE_COMMIT: ${{ github.sha }}
          BG_REQUIRED_SEMANTIC_ATTENTION_WEBGPU_EVIDENCE_COMMIT: ${{ github.sha }}
          BG_REQUIRED_SEMANTIC_ATTENTION_WEBGPU_PERFORMANCE_EVIDENCE_COMMIT: ${{ github.sha }}
          BG_REQUIRED_COMPILER_LAYOUT_WEBGPU_EVIDENCE_COMMIT: ${{ github.sha }}
          BG_REQUIRED_COMPILER_VIEW_COPY_BINDINGS_WEBGPU_EVIDENCE_COMMIT: ${{ github.sha }}
          BG_REQUIRED_JIT_SEMANTIC_PERMUTE_WEBGPU_EVIDENCE_COMMIT: ${{ github.sha }}

      - name: Retain immutable npm artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-release-artifacts-${{ github.sha }}
          path: npm-release-artifacts
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish protected immutable package
    needs: validate
    runs-on: ubuntu-latest
    environment: npm-production
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install attestation-capable npm CLI
        run: npm install --global npm@11.12.1 --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ''
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ''
          NPM_CONFIG_USERCONFIG: /dev/null
          NPM_CONFIG_GLOBALCONFIG: /dev/null

      - name: Require attestation-capable npm CLI
        run: node scripts/require-npm-version.mjs 11.12.0

      - name: Download immutable npm artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-release-artifacts-${{ github.sha }}
          path: npm-release-artifacts

      - name: Verify release commit is still reachable from main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::Release SHA must remain reachable from protected main"
            exit 1
          }

      - name: Publish immutable artifact to npm
        run: node scripts/publish-missing-npm.mjs --publish-staged npm-release-artifacts --package "${{ needs.validate.outputs.npmname }}" --provenance

  github-release:
    name: Create or update GitHub Release
    needs: [validate, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}

      - name: Extract changelog excerpt
        working-directory: packages/${{ needs.validate.outputs.package }}
        run: |
          awk -v version="${{ needs.validate.outputs.version }}" '/^## / {if(found) exit; found=($0 ~ version)} found' CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "See CHANGELOG.md for details." > /tmp/release-notes.md
          fi

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --title "${{ needs.validate.outputs.npmname }} v${{ needs.validate.outputs.version }}" \
              --notes-file /tmp/release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "${{ needs.validate.outputs.npmname }} v${{ needs.validate.outputs.version }}" \
              --notes-file /tmp/release-notes.md
          fi
