name: Build pinned Clang-Wasm extractor

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run cached fast feedback, one clean build, or two clean reproducibility builds
        required: true
        default: fast-validation
        type: choice
        options:
          - fast-validation
          - clean-validation
          - reproducibility

permissions:
  contents: read

concurrency:
  group: clang-wasm-build-${{ github.ref }}-${{ inputs.mode }}
  cancel-in-progress: ${{ inputs.mode == 'fast-validation' }}

jobs:
  verification-boundary:
    name: Verify JavaScript build boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Install Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Verify the JavaScript boundary outside the compiler critical path
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm --filter @unlocalhosted/browsergrad-compiler... build
          if [[ "${{ inputs.mode }}" == 'fast-validation' ]]; then
            pnpm --filter @unlocalhosted/browsergrad-compiler test:browser-clang-wasm-build-plan:fast
          else
            pnpm --filter @unlocalhosted/browsergrad-compiler test:browser-clang-wasm-build-plan:run
          fi

  build:
    name: Locked Linux amd64 build ${{ matrix.buildOrdinal }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        buildOrdinal: ${{ fromJSON(inputs.mode == 'reproducibility' && '[1,2]' || '[1]') }}
    env:
      BG_CLANG_BUILD_ORDINAL: ${{ matrix.buildOrdinal }}
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Install Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Materialize the exact JavaScript runtime closure
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm --filter @unlocalhosted/browsergrad-compiler... build

      - name: Project the diagnostic toolchain cache key
        id: toolchain-cache-key
        if: ${{ inputs.mode == 'fast-validation' }}
        run: |
          set -euo pipefail
          node \
            packages/browsergrad-compiler/scripts/cpp_cute_browser_build/cpp_cute_browser_toolchain_cache.mjs \
            --github-output >> "${GITHUB_OUTPUT}"

      - name: Allocate private acquisition and build roots
        run: |
          set -euo pipefail
          bg_clang_build_root="$(mktemp -d "${RUNNER_TEMP}/browsergrad-clang-wasm.XXXXXX")"
          bg_clang_cache_root="${RUNNER_TEMP}/browsergrad-clang-wasm-cache-v2/build-${BG_CLANG_BUILD_ORDINAL}"
          chmod 0700 "${bg_clang_build_root}"
          mkdir -m 0700 \
            "${bg_clang_build_root}/inputs" \
            "${bg_clang_build_root}/work" \
            "${bg_clang_build_root}/work/build-${BG_CLANG_BUILD_ORDINAL}" \
            "${RUNNER_TEMP}/browsergrad-clang-wasm-cache-v2" \
            "${bg_clang_cache_root}"
          echo "BG_CLANG_BUILD_ROOT=${bg_clang_build_root}" >> "${GITHUB_ENV}"
          echo "BG_CLANG_CACHE_ROOT=${bg_clang_cache_root}" >> "${GITHUB_ENV}"

      - name: Restore the untrusted diagnostic toolchain cache
        id: toolchain-cache
        if: ${{ inputs.mode == 'fast-validation' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/browsergrad-clang-wasm-cache-v2/build-${{ matrix.buildOrdinal }}/native-tablegen
            ${{ runner.temp }}/browsergrad-clang-wasm-cache-v2/build-${{ matrix.buildOrdinal }}/clang-extractor-wasm
          key: linux-amd64-${{ steps.toolchain-cache-key.outputs.cache-key }}
          restore-keys: |
            linux-amd64-${{ steps.toolchain-cache-key.outputs.compatible-legacy-cache-key }}

      - name: Admit the restored diagnostic cache into the private build root
        if: ${{ inputs.mode == 'fast-validation' }}
        env:
          BG_MATCHED_DIAGNOSTIC_CACHE_KEY: ${{ steps.toolchain-cache.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          bg_cache_source=''
          if [[ -n "${BG_MATCHED_DIAGNOSTIC_CACHE_KEY}" ]]; then
            bg_cache_source="${BG_CLANG_CACHE_ROOT}"
          fi
          if [[ -n "${bg_cache_source}" ]]; then
            for bg_cache_entry in native-tablegen clang-extractor-wasm; do
              test -d "${bg_cache_source}/${bg_cache_entry}"
              test ! -L "${bg_cache_source}/${bg_cache_entry}"
              mv \
                "${bg_cache_source}/${bg_cache_entry}" \
                "${BG_CLANG_BUILD_ROOT}/work/build-${BG_CLANG_BUILD_ORDINAL}/${bg_cache_entry}"
            done
          fi

      - name: Stage the exact build runtime closure
        run: |
          set -euo pipefail
          node \
            packages/browsergrad-compiler/scripts/cpp_cute_browser_build/cpp_cute_browser_build_runtime_closure.mjs \
            --source-root="${GITHUB_WORKSPACE}" \
            --output-root="${BG_CLANG_BUILD_ROOT}/inputs/runtime-workspace"

      - name: Acquire and verify the locked LLVM source archive
        run: |
          set -euo pipefail
          bg_llvm_archive="${BG_CLANG_BUILD_ROOT}/inputs/llvm-project-22.1.8.src.tar.xz"
          curl \
            --fail \
            --location \
            --proto '=https' \
            --retry 5 \
            --retry-all-errors \
            --show-error \
            --silent \
            --tlsv1.2 \
            --output "${bg_llvm_archive}" \
            'https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/llvm-project-22.1.8.src.tar.xz'
          test "$(stat --format='%s' "${bg_llvm_archive}")" = '167061596'
          echo '922f1817a0df7b1489272d18134ee0087a8b068828f87ac63b9861b1a9965888  '"${bg_llvm_archive}" | sha256sum --check --strict
          mkdir -m 0700 "${BG_CLANG_BUILD_ROOT}/inputs/llvm-project"
          tar \
            --extract \
            --xz \
            --file "${bg_llvm_archive}" \
            --directory "${BG_CLANG_BUILD_ROOT}/inputs/llvm-project" \
            --strip-components=1 \
            --no-same-owner \
            --no-same-permissions
          test -f "${BG_CLANG_BUILD_ROOT}/inputs/llvm-project/llvm/CMakeLists.txt"
          chmod 0444 "${bg_llvm_archive}"

      - name: Pull and verify the locked builder image
        run: |
          set -euo pipefail
          bg_builder_ref='docker.io/emscripten/emsdk@sha256:2a7a41cd7e2065b30ba389c8db0fbeaebd7ec06bb4e20f23cab8ba92180f25c7'
          docker pull --platform linux/amd64 "${bg_builder_ref}"
          bg_observed_config="$(docker image inspect --format='{{.Id}}' "${bg_builder_ref}")"
          bg_observed_os="$(docker image inspect --format='{{.Os}}' "${bg_builder_ref}")"
          bg_observed_arch="$(docker image inspect --format='{{.Architecture}}' "${bg_builder_ref}")"
          test "${bg_observed_config}" = 'sha256:1998ba0793f0e61685f08c62a3e78bbcd1ef84895fefe994bf48d8d66dc1e495'
          test "${bg_observed_os}" = 'linux'
          test "${bg_observed_arch}" = 'amd64'
          jq --compact-output --null-input \
            --arg schema 'browsergrad.compiler.cpp-cute.builder-container-observation' \
            --arg platform 'linux/amd64' \
            --arg manifest 'sha256:2a7a41cd7e2065b30ba389c8db0fbeaebd7ec06bb4e20f23cab8ba92180f25c7' \
            --arg config "${bg_observed_config}" \
            '{schema:$schema,version:1,platform:$platform,platformManifestDigest:$manifest,imageConfigDigest:$config}' \
            > "${BG_CLANG_BUILD_ROOT}/inputs/builder-observation.json"
          chmod 0444 "${BG_CLANG_BUILD_ROOT}/inputs/builder-observation.json"

      - name: Execute the locked build without network or ambient privilege
        run: |
          set -euo pipefail
          bg_builder_ref='docker.io/emscripten/emsdk@sha256:2a7a41cd7e2065b30ba389c8db0fbeaebd7ec06bb4e20f23cab8ba92180f25c7'
          docker run \
            --rm \
            --platform linux/amd64 \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --pids-limit 4096 \
            --ulimit nofile=65536:65536 \
            --user "$(id -u):$(id -g)" \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=67108864 \
            --mount "type=bind,src=${BG_CLANG_BUILD_ROOT}/inputs/runtime-workspace,dst=/workspace,readonly" \
            --mount "type=bind,src=${BG_CLANG_BUILD_ROOT}/inputs,dst=/browsergrad/inputs/build-${BG_CLANG_BUILD_ORDINAL},readonly" \
            --mount "type=bind,src=${BG_CLANG_BUILD_ROOT}/work/build-${BG_CLANG_BUILD_ORDINAL},dst=/browsergrad/work/build-${BG_CLANG_BUILD_ORDINAL}" \
            --workdir /workspace/packages/browsergrad-compiler \
            --entrypoint node \
            "${bg_builder_ref}" \
            scripts/cpp_cute_browser_build/cpp_cute_browser_build_runner.mjs \
            --workspace-root=/workspace \
            --execution-mode="${{ inputs.mode == 'fast-validation' && 'cached-diagnostic' || 'clean' }}" \
            --llvm-archive=/browsergrad/inputs/build-${BG_CLANG_BUILD_ORDINAL}/llvm-project-22.1.8.src.tar.xz \
            --llvm-source-root=/browsergrad/inputs/build-${BG_CLANG_BUILD_ORDINAL}/llvm-project \
            --work-root=/browsergrad/work/build-${BG_CLANG_BUILD_ORDINAL} \
            --builder-observation=/browsergrad/inputs/build-${BG_CLANG_BUILD_ORDINAL}/builder-observation.json

      - name: Stage a complete reusable diagnostic toolchain cache
        id: stage-toolchain-cache
        if: ${{ success() && inputs.mode == 'fast-validation' && steps.toolchain-cache.outputs.cache-hit != 'true' }}
        run: |
          set -euo pipefail
          bg_build_root="${BG_CLANG_BUILD_ROOT}/work/build-${BG_CLANG_BUILD_ORDINAL}"
          for bg_required_path in \
            native-tablegen/bin/clang-tblgen \
            native-tablegen/bin/llvm-tblgen \
            clang-extractor-wasm/lib/libclangAST.a \
            clang-extractor-wasm/lib/libclangBasic.a \
            clang-extractor-wasm/lib/libclangDriver.a \
            clang-extractor-wasm/lib/libclangFrontend.a \
            clang-extractor-wasm/lib/libclangIndex.a \
            clang-extractor-wasm/lib/libclangLex.a \
            clang-extractor-wasm/lib/libclangParse.a \
            clang-extractor-wasm/lib/libclangSema.a \
            clang-extractor-wasm/lib/libclangSerialization.a \
            clang-extractor-wasm/lib/libclangTooling.a; do
            if [[ ! -f "${bg_build_root}/${bg_required_path}" || -L "${bg_build_root}/${bg_required_path}" ]]; then
              echo 'cache-ready=false' >> "${GITHUB_OUTPUT}"
              exit 0
            fi
          done
          for bg_cache_entry in native-tablegen clang-extractor-wasm; do
            mv \
              "${bg_build_root}/${bg_cache_entry}" \
              "${BG_CLANG_CACHE_ROOT}/${bg_cache_entry}"
          done
          echo 'cache-ready=true' >> "${GITHUB_OUTPUT}"

      - name: Save the untrusted diagnostic toolchain cache
        if: ${{ always() && steps.stage-toolchain-cache.outputs.cache-ready == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/browsergrad-clang-wasm-cache-v2/build-${{ matrix.buildOrdinal }}/native-tablegen
            ${{ runner.temp }}/browsergrad-clang-wasm-cache-v2/build-${{ matrix.buildOrdinal }}/clang-extractor-wasm
          key: linux-amd64-${{ steps.toolchain-cache-key.outputs.cache-key }}

      - name: Inspect built Wasm against the pinned runtime ABI
        if: success()
        run: |
          set -euo pipefail
          bg_output_root="${BG_CLANG_BUILD_ROOT}/work/build-${BG_CLANG_BUILD_ORDINAL}/output"
          node \
            packages/browsergrad-compiler/scripts/cpp_cute_browser_build/cpp_cute_browser_wasm_review.mjs \
            --wasm="${bg_output_root}/browsergrad-cpp-cute/clang-extractor.wasm" \
            --output="${bg_output_root}/clang-wasm-runtime-abi-review.v1.json" \
            --require-exact-interface

      - name: Summarize exact build outputs
        if: success()
        run: |
          set -euo pipefail
          if [[ "${{ inputs.mode }}" == 'fast-validation' ]]; then
            bg_build_observation="${BG_CLANG_BUILD_ROOT}/work/build-${BG_CLANG_BUILD_ORDINAL}/output/fast-validation-observation.v1.json"
          else
            bg_build_observation="${BG_CLANG_BUILD_ROOT}/work/build-${BG_CLANG_BUILD_ORDINAL}/output/build-execution-observation.v2.json"
          fi
          sha256sum \
            "${bg_build_observation}" \
            "${BG_CLANG_BUILD_ROOT}/work/build-${BG_CLANG_BUILD_ORDINAL}/output/clang-wasm-runtime-abi-review.v1.json" \
            "${BG_CLANG_BUILD_ROOT}/work/build-${BG_CLANG_BUILD_ORDINAL}/output/browsergrad-cpp-cute/clang-extractor.wasm"
          du --human-readable --summarize \
            "${BG_CLANG_BUILD_ROOT}/work/build-${BG_CLANG_BUILD_ORDINAL}/output" \
            "${BG_CLANG_BUILD_ROOT}/work/build-${BG_CLANG_BUILD_ORDINAL}/state/evidence"

      - name: Upload bounded build evidence
        if: ${{ always() && env.BG_CLANG_BUILD_ROOT != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.mode == 'fast-validation' && 'clang-wasm-fast-validation' || 'clang-wasm-build' }}-${{ github.run_id }}-${{ matrix.buildOrdinal }}
          path: |
            ${{ env.BG_CLANG_BUILD_ROOT }}/work/build-${{ matrix.buildOrdinal }}/output
            ${{ env.BG_CLANG_BUILD_ROOT }}/work/build-${{ matrix.buildOrdinal }}/state/evidence
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6

  reproducibility:
    name: Verify two clean extractor builds
    needs: [build]
    if: ${{ inputs.mode == 'reproducibility' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Install Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Build the reproducibility verification boundary
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm --filter @unlocalhosted/browsergrad-compiler... build

      - name: Allocate private comparison root
        run: |
          set -euo pipefail
          bg_clang_repro_root="${RUNNER_TEMP}/browsergrad-clang-wasm-repro-${GITHUB_RUN_ID}"
          mkdir -m 0700 "${bg_clang_repro_root}"
          echo "BG_CLANG_REPRO_ROOT=${bg_clang_repro_root}" >> "${GITHUB_ENV}"

      - name: Download clean build 1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: clang-wasm-build-${{ github.run_id }}-1
          path: ${{ runner.temp }}/browsergrad-clang-wasm-repro-${{ github.run_id }}/first

      - name: Download clean build 2
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: clang-wasm-build-${{ github.run_id }}-2
          path: ${{ runner.temp }}/browsergrad-clang-wasm-repro-${{ github.run_id }}/second

      - name: Verify extractor reproducibility
        run: |
          set -euo pipefail
          node \
            packages/browsergrad-compiler/scripts/cpp_cute_browser_build/cpp_cute_browser_build_reproducibility.mjs \
            --first-root="${BG_CLANG_REPRO_ROOT}/first" \
            --second-root="${BG_CLANG_REPRO_ROOT}/second" \
            --output="${BG_CLANG_REPRO_ROOT}/clang-wasm-reproducibility.v3.json"
          sha256sum "${BG_CLANG_REPRO_ROOT}/clang-wasm-reproducibility.v3.json"

      - name: Inspect reproducible Wasm against the pinned runtime ABI
        run: |
          set -euo pipefail
          node \
            packages/browsergrad-compiler/scripts/cpp_cute_browser_build/cpp_cute_browser_wasm_review.mjs \
            --wasm="${BG_CLANG_REPRO_ROOT}/first/output/browsergrad-cpp-cute/clang-extractor.wasm" \
            --output="${BG_CLANG_REPRO_ROOT}/clang-wasm-runtime-abi-review.v1.json" \
            --require-exact-interface
          sha256sum "${BG_CLANG_REPRO_ROOT}/clang-wasm-runtime-abi-review.v1.json"

      - name: Upload reproducibility and raw-Wasm review evidence
        if: ${{ success() && env.BG_CLANG_REPRO_ROOT != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clang-wasm-reproducibility-${{ github.run_id }}
          path: |
            ${{ env.BG_CLANG_REPRO_ROOT }}/clang-wasm-reproducibility.v3.json
            ${{ env.BG_CLANG_REPRO_ROOT }}/clang-wasm-runtime-abi-review.v1.json
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
