# CI — build + test on every push and pull request.
#
# Twelve job families, run in parallel:
#   1. surface — fast `vitest run` on each package (~5s wall-clock each)
#   2. compiler-native — the required LLVM/Clang harness, isolated from the
#      ordinary Node-24 surface so neither lane queues behind the other.
#   3. integration — Pyodide-in-node integration suites (~30s wall-clock each)
#   4. browser — real Chromium + WebGPU via Playwright. Linux only; macOS
#      headed Metal cannot run on hosted runners. Set BG_BROWSER_HEADLESS=1
#      and pass the WebGPU flags the config already declares.
#   5. semantic-gemm-webgpu — required irregular tiled-GEMM evidence in an
#      isolated lane so it does not extend the broad browser critical path.
#   6. semantic-host-graph-webgpu — required static-DAG dispatch/collective
#      evidence isolated from the broad browser critical path.
#   7. semantic-host-graph-worker-webgpu — required one-shot dedicated Worker
#      transport and Worker-owned WebGPU execution evidence.
#   8. semantic-host-graph-performance-webgpu — observational fixed-repeat
#      versus equivalent unrolled host-API timing, isolated from correctness.
#   9. real-world-audits — one full-corpus compile/codegen audit lane.
#  10. semantic-attention-webgpu — required causal/non-causal block-tiled
#      attention evidence, isolated from the broad browser lane.
#  11. semantic-attention-performance-webgpu — observational block-tiled versus
#      row-wise host-API timing, isolated from correctness and broad browser work.
#  12. browser-real-world — source and dist CUDA browser gates on separate
#      runners, each retaining full fixture and auto-corpus execution coverage.
#
# Build matrix:
#   - Node 20 (oldest supported via engines.node ≥20)
#   - Node 24 (LTS and exact native compiler-harness lane)
#   - Node 25 (current developer default compatibility)
#
# Fail-fast disabled so we always see the full matrix when one job breaks.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-flight runs from earlier pushes on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  surface:
    name: Surface tests (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24, 25]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build

      - name: Verify compiler Node-only Docker shell
        run: pnpm --filter @unlocalhosted/browsergrad-compiler test:aot-docker-shell:run

      - run: pnpm architecture:check
      - run: pnpm -r test

      - name: Run compiler typecheck
        run: pnpm --filter @unlocalhosted/browsergrad-compiler typecheck

      - name: Run compiler lint
        run: pnpm --filter @unlocalhosted/browsergrad-compiler lint

  compiler-native:
    name: Compiler required-native harness (Node 24)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build

      - name: Install required native Clang integration toolchain
        run: |
          set -euo pipefail
          bg_llvm_key="$(mktemp)"
          curl --fail --silent --show-error --location \
            https://apt.llvm.org/llvm-snapshot.gpg.key \
            --output "${bg_llvm_key}"
          echo "8b2a587ffd672c4687e7581dad4b2f6c1bb2ad6b480cd9771ba2ff48e0b8c75d  ${bg_llvm_key}" | sha256sum --check
          sudo install -d -m 0755 /etc/apt/keyrings
          sudo install -m 0644 "${bg_llvm_key}" /etc/apt/keyrings/llvm-snapshot.asc
          echo "deb [signed-by=/etc/apt/keyrings/llvm-snapshot.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" | \
            sudo tee /etc/apt/sources.list.d/llvm22.list >/dev/null
          sudo apt-get update
          bg_llvm_package_version="1:22.1.8~++20260613092238+e80beda6e255-1~exp1~20260613092253.78"
          sudo apt-get install --yes --no-install-recommends \
            "clang-22=${bg_llvm_package_version}" \
            "libclang-22-dev=${bg_llvm_package_version}" \
            "libclang-cpp22-dev=${bg_llvm_package_version}" \
            "libclang-rt-22-dev=${bg_llvm_package_version}" \
            "llvm-22-dev=${bg_llvm_package_version}"
          bg_llvm_config="/usr/lib/llvm-22/bin/llvm-config"
          test -x "${bg_llvm_config}"
          test "$("${bg_llvm_config}" --version)" = "22.1.8"
          echo "BROWSERGRAD_LLVM_CONFIG=${bg_llvm_config}" >> "${GITHUB_ENV}"
          echo "BROWSERGRAD_NATIVE_CXX=/usr/lib/llvm-22/bin/clang++" >> "${GITHUB_ENV}"

      - name: Verify compiler Clang-Wasm build plan and native primitives
        run: pnpm --filter @unlocalhosted/browsergrad-compiler test:browser-clang-wasm-build-plan:required-native

      - name: Verify compiler source, build-harness, and native architecture
        run: pnpm --filter @unlocalhosted/browsergrad-compiler architecture:check

  integration-jit:
    name: Pyodide JIT integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build

      - name: Run jit integration suite
        run: pnpm --filter @unlocalhosted/browsergrad-jit test:integration

  integration-grad:
    name: Pyodide Grad integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build

      - name: Run blocking Grad Gate 0 contract
        run: pnpm --filter @unlocalhosted/browsergrad-grad exec vitest run --config vitest.integration.config.ts tests-integration/gate0_dtype_view_contract.test.ts

      - name: Run grad integration suite
        # grad ships its own integration tests; pnpm -r picks them up
        run: pnpm --filter @unlocalhosted/browsergrad-grad test:integration

  browser:
    name: Real WebGPU tests (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BG_BROWSER_HEADLESS: '1'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build

      # Playwright Chromium ships with WebGPU + SwiftShader. The vitest
      # browser config already passes the flags; we just need the binary.
      - name: Install Playwright Chromium
        run: pnpm --filter @unlocalhosted/browsergrad-kernels exec playwright install --with-deps chromium

      - name: Run kernels browser suite
        run: >-
          pnpm --filter @unlocalhosted/browsergrad-kernels exec vitest run
          --config vitest.browser.config.ts
          --exclude tests-browser/semantic_host_graph_webgpu.test.ts
          --exclude tests-browser/semantic_host_graph_worker_webgpu.test.ts
          --exclude tests-browser/semantic_host_graph_performance_webgpu.test.ts
          --exclude tests-browser/semantic_gemm_webgpu.test.ts
          --exclude tests-browser/semantic_attention_webgpu.test.ts
          --exclude tests-browser/semantic_attention_performance_webgpu.test.ts

      - name: Run compiler browser suite
        run: pnpm --filter @unlocalhosted/browsergrad-compiler test:browser

      - name: Run required compiler CuTe view-copy WebGPU evidence
        run: pnpm --filter @unlocalhosted/browsergrad-compiler test:browser:cpp-cute-view-copy:required

  semantic-host-graph-webgpu:
    name: Required semantic host-graph WebGPU evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BG_BROWSER_HEADLESS: '1'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build semantic host-graph dependency closure
        run: |
          pnpm --filter @unlocalhosted/browsergrad-semantic-core build
          pnpm --filter @unlocalhosted/browsergrad-kernels build

      - name: Install Playwright Chromium
        run: pnpm --filter @unlocalhosted/browsergrad-kernels exec playwright install --with-deps chromium

      - name: Run required static-DAG host-graph evidence
        run: |
          set -o pipefail
          pnpm --filter @unlocalhosted/browsergrad-kernels test:browser:semantic-host-graph:required 2>&1 | tee semantic-host-graph-webgpu-evidence.log

      - name: Retain semantic host-graph WebGPU evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semantic-host-graph-webgpu-evidence-${{ github.sha }}
          path: semantic-host-graph-webgpu-evidence.log
          if-no-files-found: error

  semantic-host-graph-worker-webgpu:
    name: Required semantic host-graph Worker WebGPU evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BG_BROWSER_HEADLESS: '1'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build semantic host-graph Worker dependency closure
        run: |
          pnpm --filter @unlocalhosted/browsergrad-semantic-core build
          pnpm --filter @unlocalhosted/browsergrad-kernels build

      - name: Install Playwright Chromium
        run: pnpm --filter @unlocalhosted/browsergrad-kernels exec playwright install --with-deps chromium

      - name: Run required one-shot Worker host-graph evidence
        run: |
          set -o pipefail
          pnpm --filter @unlocalhosted/browsergrad-kernels test:browser:semantic-host-graph-worker:required 2>&1 | tee semantic-host-graph-worker-webgpu-evidence.log

      - name: Retain semantic host-graph Worker WebGPU evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semantic-host-graph-worker-webgpu-evidence-${{ github.sha }}
          path: semantic-host-graph-worker-webgpu-evidence.log
          if-no-files-found: error

  semantic-host-graph-performance-webgpu:
    name: Required semantic host-graph WebGPU performance observation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BG_BROWSER_HEADLESS: '1'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build semantic host-graph performance dependency closure
        run: |
          pnpm --filter @unlocalhosted/browsergrad-semantic-core build
          pnpm --filter @unlocalhosted/browsergrad-kernels build

      - name: Install Playwright Chromium
        run: pnpm --filter @unlocalhosted/browsergrad-kernels exec playwright install --with-deps chromium

      - name: Run required host-graph performance observation
        run: |
          set -o pipefail
          pnpm --filter @unlocalhosted/browsergrad-kernels test:browser:semantic-host-graph:performance:required 2>&1 | tee semantic-host-graph-performance-webgpu-evidence.log

      - name: Retain semantic host-graph WebGPU performance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semantic-host-graph-performance-webgpu-evidence-${{ github.sha }}
          path: semantic-host-graph-performance-webgpu-evidence.log
          if-no-files-found: error

  semantic-gemm-webgpu:
    name: Required semantic GEMM WebGPU evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BG_BROWSER_HEADLESS: '1'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build semantic GEMM dependency closure
        run: |
          pnpm --filter @unlocalhosted/browsergrad-semantic-core build
          pnpm --filter @unlocalhosted/browsergrad-kernels build

      - name: Install Playwright Chromium
        run: pnpm --filter @unlocalhosted/browsergrad-kernels exec playwright install --with-deps chromium

      - name: Run required irregular tiled-GEMM evidence
        run: |
          set -o pipefail
          pnpm --filter @unlocalhosted/browsergrad-kernels test:browser:semantic-gemm:required 2>&1 | tee semantic-gemm-webgpu-evidence.log

      - name: Retain semantic GEMM WebGPU evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semantic-gemm-webgpu-evidence-${{ github.sha }}
          path: semantic-gemm-webgpu-evidence.log
          if-no-files-found: error

  semantic-attention-webgpu:
    name: Required semantic attention WebGPU evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BG_BROWSER_HEADLESS: '1'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build semantic attention dependency closure
        run: |
          pnpm --filter @unlocalhosted/browsergrad-semantic-core build
          pnpm --filter @unlocalhosted/browsergrad-kernels build

      - name: Install Playwright Chromium
        run: pnpm --filter @unlocalhosted/browsergrad-kernels exec playwright install --with-deps chromium

      - name: Run required block-tiled attention evidence
        run: |
          set -o pipefail
          pnpm --filter @unlocalhosted/browsergrad-kernels test:browser:semantic-attention:required 2>&1 | tee semantic-attention-webgpu-evidence.log

      - name: Retain semantic attention WebGPU evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semantic-attention-webgpu-evidence-${{ github.sha }}
          path: semantic-attention-webgpu-evidence.log
          if-no-files-found: error

  semantic-attention-performance-webgpu:
    name: Required semantic attention WebGPU performance observation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BG_BROWSER_HEADLESS: '1'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build semantic attention performance dependency closure
        run: |
          pnpm --filter @unlocalhosted/browsergrad-semantic-core build
          pnpm --filter @unlocalhosted/browsergrad-kernels build

      - name: Install Playwright Chromium
        run: pnpm --filter @unlocalhosted/browsergrad-kernels exec playwright install --with-deps chromium

      - name: Run required block-tiled attention performance observation
        run: |
          set -o pipefail
          pnpm --filter @unlocalhosted/browsergrad-kernels test:browser:semantic-attention:performance:required 2>&1 | tee semantic-attention-performance-webgpu-evidence.log

      - name: Retain semantic attention WebGPU performance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semantic-attention-performance-webgpu-evidence-${{ github.sha }}
          path: semantic-attention-performance-webgpu-evidence.log
          if-no-files-found: error

  real-world-audits:
    name: Real-world CUDA compile/codegen audits
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build

      - name: Provision pinned real-world CUDA corpora for audits
        run: pnpm --filter @unlocalhosted/browsergrad-compiler provision:real-world-cuda

      - name: Run complete real-world CUDA compile/codegen audit
        run: >-
          pnpm --filter @unlocalhosted/browsergrad-compiler
          verify:real-world-cuda --
          --skip-build
          --skip-fetch
          --verification-scope=compile-codegen-audits
          --timing-json=.tmp/real-world-cuda-timing-compile-codegen-audits.json

      - name: Upload real-world CUDA compile/codegen timing attribution
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-world-cuda-timing-compile-codegen-audits-${{ github.sha }}
          path: .tmp/real-world-cuda-timing-compile-codegen-audits.json
          if-no-files-found: warn

  browser-real-world:
    name: Real-world CUDA (${{ matrix.bundle }} bundle)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        bundle: [src, dist]
    env:
      BG_BROWSER_HEADLESS: '1'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build

      - name: Install Playwright Chromium
        run: pnpm --filter @unlocalhosted/browsergrad-kernels exec playwright install --with-deps chromium

      - name: Provision pinned real-world CUDA corpora
        run: pnpm --filter @unlocalhosted/browsergrad-compiler provision:real-world-cuda

      - name: Run complete real-world CUDA bundle gate
        run: >-
          pnpm --filter @unlocalhosted/browsergrad-compiler
          verify:real-world-cuda --
          --skip-build
          --skip-fetch
          --require-webgpu
          --verification-scope=browser-execution
          --bundle=${{ matrix.bundle }}
          --browser-shards=2
          --timing-json=.tmp/real-world-cuda-timing-${{ matrix.bundle }}.json

      - name: Upload real-world CUDA timing attribution
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-world-cuda-timing-${{ matrix.bundle }}-${{ github.sha }}
          path: .tmp/real-world-cuda-timing-${{ matrix.bundle }}.json
          if-no-files-found: warn
