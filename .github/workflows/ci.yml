# CI — build + test on every push and pull request.
#
# Three jobs, run in parallel:
#   1. surface — fast `vitest run` on each package (~5s wall-clock each)
#   2. integration — Pyodide-in-node integration suites (~30s wall-clock each)
#   3. browser — real Chromium + WebGPU via Playwright. Linux only; macOS
#      headed Metal cannot run on hosted runners. Set BG_BROWSER_HEADLESS=1
#      and pass the WebGPU flags the config already declares.
#
# Build matrix:
#   - Node 20 (oldest supported via engines.node ≥20)
#   - Node 24 (current)
#
# Fail-fast disabled so we always see the full matrix when one job breaks.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-flight runs from earlier pushes on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  surface:
    name: Surface tests (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build

      - name: Install required native Clang integration toolchain
        if: matrix.node == 24
        run: |
          set -euo pipefail
          bg_llvm_key="$(mktemp)"
          curl --fail --silent --show-error --location \
            https://apt.llvm.org/llvm-snapshot.gpg.key \
            --output "${bg_llvm_key}"
          echo "8b2a587ffd672c4687e7581dad4b2f6c1bb2ad6b480cd9771ba2ff48e0b8c75d  ${bg_llvm_key}" | sha256sum --check
          sudo install -d -m 0755 /etc/apt/keyrings
          sudo install -m 0644 "${bg_llvm_key}" /etc/apt/keyrings/llvm-snapshot.asc
          echo "deb [signed-by=/etc/apt/keyrings/llvm-snapshot.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" | \
            sudo tee /etc/apt/sources.list.d/llvm22.list >/dev/null
          sudo apt-get update
          bg_llvm_package_version="1:22.1.8~++20260613092238+e80beda6e255-1~exp1~20260613092253.78"
          sudo apt-get install --yes --no-install-recommends \
            "clang-22=${bg_llvm_package_version}" \
            "libclang-22-dev=${bg_llvm_package_version}" \
            "libclang-cpp22-dev=${bg_llvm_package_version}" \
            "llvm-22-dev=${bg_llvm_package_version}"
          bg_llvm_config="/usr/lib/llvm-22/bin/llvm-config"
          test -x "${bg_llvm_config}"
          test "$("${bg_llvm_config}" --version)" = "22.1.8"
          echo "BROWSERGRAD_LLVM_CONFIG=${bg_llvm_config}" >> "${GITHUB_ENV}"
          echo "BROWSERGRAD_NATIVE_CXX=/usr/lib/llvm-22/bin/clang++" >> "${GITHUB_ENV}"

      - name: Verify compiler Node-only Docker shell
        run: pnpm --filter @unlocalhosted/browsergrad-compiler test:aot-docker-shell:run

      - name: Verify compiler Clang-Wasm build plan and native primitives
        if: matrix.node == 24
        run: pnpm --filter @unlocalhosted/browsergrad-compiler test:browser-clang-wasm-build-plan:required-native

      - name: Verify compiler source, build-harness, and native architecture
        if: matrix.node == 24
        run: pnpm --filter @unlocalhosted/browsergrad-compiler architecture:check

      - run: pnpm architecture:check
      - run: pnpm -r test

      - name: Run compiler typecheck
        run: pnpm --filter @unlocalhosted/browsergrad-compiler typecheck

      - name: Run compiler lint
        run: pnpm --filter @unlocalhosted/browsergrad-compiler lint

  integration:
    name: Pyodide integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build

      - name: Run jit integration suite
        run: pnpm --filter @unlocalhosted/browsergrad-jit test:integration

      - name: Run blocking Grad Gate 0 contract
        run: pnpm --filter @unlocalhosted/browsergrad-grad exec vitest run --config vitest.integration.config.ts tests-integration/gate0_dtype_view_contract.test.ts

      - name: Run grad integration suite
        # grad ships its own integration tests; pnpm -r picks them up
        run: pnpm --filter @unlocalhosted/browsergrad-grad test:integration

  browser:
    name: Real WebGPU tests (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BG_BROWSER_HEADLESS: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build

      # Playwright Chromium ships with WebGPU + SwiftShader. The vitest
      # browser config already passes the flags; we just need the binary.
      - name: Install Playwright Chromium
        run: pnpm --filter @unlocalhosted/browsergrad-kernels exec playwright install --with-deps chromium

      - name: Run kernels browser suite
        run: pnpm --filter @unlocalhosted/browsergrad-kernels test:browser

      - name: Run compiler browser suite
        run: pnpm --filter @unlocalhosted/browsergrad-compiler test:browser

      - name: Run compiler real-world CUDA gate
        run: pnpm --filter @unlocalhosted/browsergrad-compiler verify:real-world-cuda -- --require-webgpu
